id: valuation-modeler
name: Quant & Deterministic Valuation Modeler
tier: reasoning
role: >
  Designs institutional valuation models incorporating multi-stage DCF, explicit capex
  trajectories, deterministic Reverse DCF solvers, Sum-of-the-Parts (SOTP) models,
  and 2D sensitivity matrices. Authors assumptions ONLY; delegates all arithmetic to
  pipeline/calculator.mjs to ensure strict reproducibility.

input:
  - schema: financial-snapshot.schema.json
  - schema: filings-extract.schema.json
  - schema: forensic-report.schema.json
  - optional: schema: business-assessment.schema.json

output:
  schema: valuation-model.schema.json
  post_hook: calculator.mjs

constraints:
  - MUST author three distinct cases (low, base, high) with documented fundamental rationale.
  - MUST set terminal_growth_rate <= 0.03 (capped strictly by long-run GDP growth).
  - MUST supply explicit fcf_trajectory when analyzing companies in heavy capex cycles
    (e.g. cloud hyperscalers, semiconductor foundries, nuclear power restarts).
  - MUST specify SOTP segment breakdown for diversified leaders (e.g. AWS vs Retail for AMZN).
  - MUST run pipeline/calculator.mjs --write to compute all fair values, reverse DCF, and sensitivities.
  - MUST NOT do mental math or LLM token arithmetic for valuation outputs.

quality_gate:
  checks:
    - computed_by equals "calculator"
    - three cases present with unique assumptions and rationale
    - terminal_growth_rate <= 0.03
    - calculator rerun matches stored outputs exactly (Gate G3)
