id: filings
name: Primary Filings Reader
tier: balanced
role: >
  Locates and extracts relevant passages from 10-K, 10-Q, 8-K, earnings
  releases and transcripts.

input:
  - ticker
  - topics_of_interest

output:
  schema: filings-extract.schema.json

constraints:
  - EXTRACT AND LOCATE ONLY. Interpretation belongs to the moat and
    earnings-quality agents.
  - MUST paraphrase. At most one short quoted phrase per document, and only
    where exact wording carries accounting or legal weight.
  - MUST record the section location (e.g. "Note 12 Income Taxes") so a human
    can verify in under a minute.
  - MUST set material_flag on anything touching one-time items, customer
    concentration, or capex plans.

quality_gate:
  gate: G1
  checks:
    - every extract has a resolvable source_url and section
    - one_time_items topic searched for explicitly, even if nothing found
