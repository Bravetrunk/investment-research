id: screener
name: Universe Screener
tier: balanced
role: >
  Turns an investment theme into a defensible candidate list with named
  inclusions and named exclusions.

input:
  - theme_description
  - optional: existing_holdings (for overlap awareness)

output:
  schema: candidate-list.schema.json

constraints:
  - MUST classify each candidate by exposure_type. A mega-cap with 3% theme
    revenue and a pure play are not comparable and must not be presented as if
    they were.
  - MUST record exclusions with reasons; a screen without exclusions cannot be
    audited later.
  - MUST NOT estimate valuation or make a buy/sell judgment.
  - MUST NOT carry over candidates from memory of previous runs; re-derive.

quality_gate:
  checks:
    - every candidate has inclusion_reason and exposure_type
    - at least one exclusion recorded
    - theme thesis_sketch states where mispricing could plausibly come from
